appId: local.confluence.editor
productName: Confluence Local
directories:
  output: dist
# better-sqlite3 v13은 NAPI 프리빌드를 패키지에 함께 배포하므로(모든 OS/아키텍처 포함)
# 네이티브 재빌드가 불필요 — 경로 공백 등으로 node-gyp 오류가 나지 않도록 끔
npmRebuild: false
# 패키징 후 Electron 보안 퓨즈 활성화(RunAsNode off, asar 무결성 등 — scripts/afterPack.cjs)
afterPack: ./scripts/afterPack.cjs
files:
  - out/**
  - package.json
win:
  target:
    - nsis
mac:
  category: public.app-category.productivity
  identity: null
  target:
    - target: dmg
    - target: zip
files:
  - out/**
  - package.json
publish:
  - provider: github
    # owner/repo는 빌드 시 GH_OWNER/GH_REPO 환경변수(또는 package.json repository)로 해석되며
    # 결과가 app-update.yml에 구워져 들어간다(앱 내 업데이트 버튼이 이 경로를 사용).
