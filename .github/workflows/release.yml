name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  # macOS 코드서명 사용 않음 (electron-builder.yml의 identity: null 과 일치).
  # 이후 서명하려면 APPLE_ID/APPLE_APP_SPECIFIC_PASSWORD/APPLE_TEAM_ID 시크릿을 추가하고
  # 이 env와 electron-builder.yml의 identity 설정을 제거하면 됨.
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${TAG}" ]; then
            echo "::error::태그(${TAG})가 package.json 버전(v${PKG_VERSION})과 일치하지 않습니다."
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" -R "${GITHUB_REPOSITORY}"; then
            echo "Release ${TAG} already exists, reusing it."
          else
            gh release create "${TAG}" \
              --draft \
              --title "${TAG}" \
              --generate-notes \
              -R "${GITHUB_REPOSITORY}"
          fi

  build:
    name: Build (${{ matrix.os }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build app (electron-vite)
        run: pnpm build

      - name: Package & upload (macOS, arm64 + x64)
        if: runner.os == 'macOS'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: pnpm exec electron-builder --mac dmg zip --x64 --arm64 --publish always
      - name: Package & upload (Windows, NSIS)
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_REPO: ${{ github.event.repository.name }}
        run: pnpm exec electron-builder --win nsis --publish always

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release edit "${TAG}" \
            --draft=false \
            --latest \
            -R "${GITHUB_REPOSITORY}"
          echo "Release published: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
